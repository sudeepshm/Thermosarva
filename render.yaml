services:
  - type: web
    name: thermosarva-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: FORTYGUARD_STUB_MODE
        value: "false"
      - key: REDIS_FALLBACK_MEMORY
        value: "true"
